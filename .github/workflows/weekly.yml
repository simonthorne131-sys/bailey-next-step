name: Weekly search

on:
  schedule:
    # Saturday 09:00 UK time. Two entries cover GMT and BST; the gate below runs it once.
    - cron: "0 8 * * 6"
    - cron: "0 9 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "Full search (reads every job site, about 12 min) or re-score only (applies changed rules to last search, about 1 min)"
        type: choice
        options: [full search, re-score only]
        default: full search

permissions:
  contents: write

concurrency:
  group: weekly-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Run only once, at or after 09:00 UK
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hour=$(TZ=Europe/London date +%H); today=$(TZ=Europe/London date +%F)
            last=$(python3 -c "import json;print(json.load(open('data/run.json')).get('today',''))" 2>/dev/null || true)
            if [ "$hour" -lt 9 ] || [ "$last" = "$today" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Offline tests
        if: steps.gate.outputs.skip != 'true'
        run: python -m pytest -q

      - name: Search, check and score
        if: steps.gate.outputs.skip != 'true' && inputs.mode != 're-score only'
        run: python -m scout.run

      - name: Re-score last search only
        if: steps.gate.outputs.skip != 'true' && inputs.mode == 're-score only'
        run: python -m scout.run --rescore

      - name: Publish the new data
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "next-step-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "${{ inputs.mode == 're-score only' && 'Re-score' || 'Weekly update' }} $(TZ=Europe/London date +%F)"
          git pull --rebase -X theirs || { git rebase --abort; exit 1; }
          git push
